syntax = "proto3";

package a2a.v1;

option go_package = "github.com/sahilpohare/p2p-a2a/gen/a2a/v1;a2av1";

// ─── Identity ────────────────────────────────────────────────────────────────

message AgentIdentity {
  string did        = 1; // did:key:z6Mk...
  string public_key = 2; // base64-encoded Ed25519 public key
  repeated string multiaddrs = 3; // libp2p multiaddrs this agent is reachable at
  // Raw SDK-owned public keys. public_key remains for v1 compatibility.
  bytes signing_public_key = 4;
  bytes encryption_public_key = 5;
}

// NodeIdentity identifies the daemon transport. It is deliberately distinct
// from AgentIdentity: SDK agents own agent keys while daemons own peer keys.
message NodeIdentity {
  string node_id = 1;
  string peer_id = 2;
  repeated string multiaddrs = 3;
}

message BeginAgentSessionRequest {
  AgentIdentity identity = 1;
}

message AgentChallenge {
  string challenge_id = 1;
  bytes nonce = 2;
  int64 expires_at_unix_ms = 3;
}

message CompleteAgentSessionRequest {
  string challenge_id = 1;
  bytes signature = 2;
  AgentCard card = 3;
}

message AgentSession {
  string token = 1;
  string agent_did = 2;
  int64 expires_at_unix_ms = 3;
}

// ─── Agent Card ──────────────────────────────────────────────────────────────

message AgentCard {
  string did         = 1;
  string name        = 2;
  string description = 3;
  repeated Skill skills = 4;
  repeated string multiaddrs = 5;
  string public_key  = 6;
  int64  published_at = 7;
  int64  expires_at   = 8;
  string signature    = 9; // base64 Ed25519 sig over canonical JSON of fields 1-8
  map<string,string> metadata = 10;
  // SDK-agent routing and encryption information, included in the signed
  // canonical card payload. The node peer ID is transport metadata only; it
  // never replaces the agent DID as the identity used by applications.
  bytes encryption_public_key = 11;
  string node_peer_id = 12;
  uint64 sequence = 13;
}

message Skill {
  string id          = 1; // e.g. "a2a:v1:cap:text-generation"
  string name        = 2;
  string description = 3;
  bytes  input_schema  = 4; // JSON Schema as bytes
  bytes  output_schema = 5;
  repeated string tags = 6; // tier-2 namespaced tags
}

// ─── Artifacts ───────────────────────────────────────────────────────────────

message Artifact {
  string cid       = 1; // CIDv1 (bafy... base32 multihash, sha2-256)
  string mime_type = 2;
  int64  size      = 3;
  bytes  inline    = 4; // populated for small artifacts (<64KB)
  string uri       = 5; // ipfs://<cid> for large artifacts (fetch via Bitswap)
  string name      = 6;
}

// ─── Messages ────────────────────────────────────────────────────────────────

message Message {
  string id        = 1; // UUID v4, also used as content ID
  string from_did  = 2;
  string to_did    = 3;
  string thread_id = 4;
  string task_id   = 5; // optional — links message to a task
  MessageKind kind = 6;
  bytes  payload   = 7; // encrypted protobuf (TaskRequest | TaskEvent | TextMessage | etc)
  int64  sent_at   = 8;
  string signature = 9; // Ed25519 sig over fields 1-8
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED  = 0;
  MESSAGE_KIND_TEXT         = 1;
  MESSAGE_KIND_TASK_REQUEST = 2;
  MESSAGE_KIND_TASK_EVENT   = 3;
  MESSAGE_KIND_TASK_RESULT  = 4;
  MESSAGE_KIND_TASK_CANCEL  = 5;
  MESSAGE_KIND_ACK           = 6;
  MESSAGE_KIND_THREAD_INVITE = 7;
}

message TextMessage {
  string text = 1;
  repeated Artifact attachments = 2;
}

// ─── Tasks ───────────────────────────────────────────────────────────────────

message Task {
  string     id           = 1;
  string     initiator    = 2; // DID
  string     assignee     = 3; // DID
  string     thread_id    = 4;
  string     skill        = 5; // capability ID
  TaskStatus status       = 6;
  repeated Artifact input_artifacts  = 7;
  repeated Artifact output_artifacts = 8;
  int64  created_at  = 9;
  int64  updated_at  = 10;
  string error       = 11;
  map<string,string> metadata = 12;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_SUBMITTED   = 1;
  TASK_STATUS_WORKING     = 2;
  TASK_STATUS_COMPLETED   = 3;
  TASK_STATUS_FAILED      = 4;
  TASK_STATUS_CANCELLED   = 5;
}

message TaskRequest {
  string skill   = 1;
  string thread_id = 2; // optional — attach to existing thread
  repeated Artifact input_artifacts = 3;
  map<string,string> metadata = 4;
}

message TaskEvent {
  string    task_id   = 1;
  TaskStatus status   = 2;
  EventKind  kind     = 3;
  bytes      data     = 4; // token chunk, tool call, status update, etc
  int64      seq      = 5; // monotonic sequence number
  int64      emitted_at = 6;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED   = 0;
  EVENT_KIND_TOKEN_CHUNK   = 1; // LLM streaming token
  EVENT_KIND_TOOL_CALL     = 2;
  EVENT_KIND_TOOL_RESULT   = 3;
  EVENT_KIND_STATUS_UPDATE = 4;
  EVENT_KIND_ARTIFACT      = 5; // intermediate artifact
  EVENT_KIND_DONE          = 6; // final event — task complete
  EVENT_KIND_ERROR         = 7;
}

message TaskStatusUpdate {
  string     task_id = 1;
  TaskStatus status  = 2;
  string     error   = 3;
  repeated Artifact output_artifacts = 4;
}

message TaskResult {
  string task_id = 1;
  TaskStatus status = 2; // completed or failed
  repeated Artifact output_artifacts = 3;
  string error = 4;
  bytes data = 5; // optional small structured/text result
}

message SendTaskResultRequest {
  string to_did = 1; // task initiator
  string thread_id = 2;
  TaskResult result = 3;
}

// ─── Discovery ───────────────────────────────────────────────────────────────

message CapabilityQuery {
  string capability = 1; // e.g. "a2a:v1:cap:text-generation"
  repeated string tags = 2; // optional tier-2 filter tags
  int32  limit     = 3; // max results, default 10
}

// ─── Inbox / Outbox ──────────────────────────────────────────────────────────

message InboxQuery {
  string thread_id = 1; // optional filter
  string task_id   = 2; // optional filter
  bool   unread_only = 3;
  int32  limit     = 4;
  int64  since     = 5; // unix timestamp
}

message OutboxQuery {
  string status = 1; // pending | delivered | failed | expired
  int32  limit  = 2;
}

message SubscribeRequest {
  string thread_id = 1; // optional — subscribe to a specific thread
  string task_id   = 2; // optional — subscribe to a specific task
}

message SendResult {
  string message_id = 1;
  bool   queued     = 2; // true if remote agent offline, message in outbox
}

message PublishResult {
  bool   success = 1;
  string error   = 2;
}

message TaskID {
  string id = 1;
  // Cursor for durable task-event replay. Ignored by unary task APIs.
  int64 after_sequence = 2;
}

message Empty {}

// ─── gRPC Service ────────────────────────────────────────────────────────────

// ─── Diagnostics ──────────────────────────────────────────────────────────────

message PingRequest {
  string target_did = 1; // DID of peer to ping; empty = loopback (measures daemon round-trip)
  int32  count      = 2; // number of pings (default 1)
}

message PingResult {
  string target_did     = 1;
  int64  latency_ms     = 2;
  bool   reachable      = 3;
  string error          = 4;
}

message PingResponse {
  repeated PingResult results = 1;
}

message PeerInfo {
  string peer_id    = 1;
  repeated string addrs = 2;
  int64  latency_ms = 3; // -1 = unknown
}

message PeersResponse {
  repeated PeerInfo peers = 1;
  int32 count             = 2;
}

message HealthResponse {
  bool   ok          = 1;
  string version     = 2;
  string did         = 3;
  int32  peer_count  = 4;
  int64  uptime_secs = 5;
}

service A2ANode {
  // Identity
  rpc GetIdentity(Empty) returns (AgentIdentity);
  rpc GetNodeIdentity(Empty) returns (NodeIdentity);
  rpc GetAgentIdentity(Empty) returns (AgentIdentity);
  rpc BeginAgentSession(BeginAgentSessionRequest) returns (AgentChallenge);
  rpc CompleteAgentSession(CompleteAgentSessionRequest) returns (AgentSession);
  rpc CloseAgentSession(Empty) returns (Empty);

  // Registry
  rpc PublishAgentCard(AgentCard) returns (PublishResult);
  rpc GetAgentCard(AgentIdentityRequest) returns (AgentCard);
  rpc FindAgents(CapabilityQuery) returns (stream AgentCard);

  // Messaging
  rpc SendMessage(Message) returns (SendResult);
  rpc SubscribeInbox(SubscribeRequest) returns (stream Message);
  rpc GetInbox(InboxQuery) returns (stream Message);
  rpc GetOutbox(OutboxQuery) returns (stream Message);
  rpc AckMessage(AckRequest) returns (Empty);

  // Tasks
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(TaskID) returns (Task);
  rpc UpdateTask(TaskStatusUpdate) returns (Task);
  rpc CancelTask(TaskID) returns (Task);
  rpc PublishTaskEvent(TaskEvent) returns (Empty);
  rpc SubscribeTaskEvents(TaskID) returns (stream TaskEvent);
  rpc SendTaskResult(SendTaskResultRequest) returns (SendResult);
  rpc SubscribeTasks(WorkerSubscription) returns (stream TaskDelivery);
  rpc ClaimTask(ClaimTaskRequest) returns (TaskLease);
  rpc RenewTaskLease(RenewTaskLeaseRequest) returns (TaskLease);
  rpc CompleteTask(CompleteTaskRequest) returns (Task);
  rpc FailTask(FailTaskRequest) returns (Task);

  // Files
  rpc SendFile(SendFileRequest) returns (Artifact);
  rpc FetchFile(FetchFileRequest) returns (stream FileChunk);

  // Threads (Tendermint BFT)
  rpc CreateThread(CreateThreadRequest) returns (Thread);
  rpc CreateThreadWithRecovery(CreateThreadRequest) returns (CreateThreadResponse);
  rpc GetThread(ThreadID) returns (Thread);
  rpc AppendEntry(AppendEntryRequest) returns (AppendEntryResult);
  rpc PutThreadKeyEnvelope(ThreadKeyEnvelope) returns (Empty);
  rpc GetThreadKeyEnvelopes(ThreadKeyEnvelopeQuery) returns (ThreadKeyEnvelopes);
	// Recovery envelopes are readable only with the complete bearer recovery
	// capability, never with a normal member session.
  rpc GetRecoveryThreadKeyEnvelopes(RecoverThreadRequest) returns (ThreadKeyEnvelopes);
  rpc GetThreadEntries(GetThreadEntriesRequest) returns (stream ThreadEntryWithPos);
  rpc SubscribeThread(SubscribeThreadRequest) returns (stream ThreadEntryWithPos);
	// An observer obtains its local committed state then signs it as a
	// catch-up attestation for the creator's promotion request.
  rpc GetThreadCatchupState(ThreadID) returns (ThreadCatchupState);
  rpc AddThreadReplica(ThreadReplicaRequest) returns (Thread);
  rpc InviteThreadMember(InviteThreadMemberRequest) returns (ThreadMembershipChange);
  rpc AcceptThreadInvite(AcceptThreadInviteRequest) returns (Thread);
  rpc PromoteThreadMember(PromoteThreadMemberRequest) returns (ThreadMembershipChange);
  rpc RemoveThreadMember(RemoveThreadMemberRequest) returns (ThreadMembershipChange);
  rpc LeaveThread(ThreadID) returns (ThreadMembershipChange);
  rpc ListThreadMembers(ThreadID) returns (ThreadMembers);
  rpc RecoverThread(ThreadID) returns (Thread);
  rpc RecoverThreadWithHandle(RecoverThreadRequest) returns (RecoverThreadResponse);

  // Diagnostics
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Health(Empty) returns (HealthResponse);
  rpc ListPeers(Empty) returns (PeersResponse);

  // PubSub
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc SubscribeTopic(SubscribeTopicRequest) returns (stream TopicMessage);

  // Webhooks
  rpc SetWebhook(SetWebhookRequest) returns (WebhookResponse);
  rpc ClearWebhook(Empty) returns (Empty);
  rpc GetWebhook(Empty) returns (WebhookResponse);

  // Networks
  rpc CreateNetwork(CreateNetworkRequest) returns (NetworkInfo);
  rpc JoinNetwork(JoinNetworkRequest) returns (NetworkInfo);
  rpc LeaveNetwork(NetworkIDRequest) returns (Empty);
  rpc ListNetworks(Empty) returns (ListNetworksResponse);
  rpc NetworkMembers(NetworkIDRequest) returns (NetworkMembersResponse);
  rpc BroadcastNetwork(BroadcastRequest) returns (Empty);
  rpc SubscribeNetwork(NetworkIDRequest) returns (stream BroadcastMessage);

  // Names
  rpc ClaimName(ClaimNameRequest) returns (NameClaimResponse);
  rpc ResolveName(ResolveNameRequest) returns (NameClaimResponse);

  // Peer connections
  rpc ConnectPeer(ConnectPeerRequest) returns (ConnectPeerResponse);
  rpc DisconnectPeer(ConnectPeerRequest) returns (Empty);
}

message AgentIdentityRequest {
  string did = 1;
}

message AckRequest {
  string message_id = 1;
}

message CreateTaskRequest {
  string to_did  = 1; // assignee DID
  TaskRequest task = 2;
  string idempotency_key = 3;
  int64 timeout_ms = 4;
  uint32 max_attempts = 5;
}

message WorkerSubscription { repeated string skills = 1; uint64 after_sequence = 2; }
message TaskDelivery { Task task = 1; uint64 sequence = 2; }
message TaskLease { string task_id = 1; string lease_token = 2; int64 expires_at_unix_ms = 3; uint32 attempt = 4; }
message ClaimTaskRequest { string task_id = 1; uint32 lease_seconds = 2; }
message RenewTaskLeaseRequest { string task_id = 1; string lease_token = 2; uint32 lease_seconds = 3; }
message CompleteTaskRequest { string task_id = 1; string lease_token = 2; repeated Artifact output_artifacts = 3; bytes data = 4; }
message FailTaskRequest { string task_id = 1; string lease_token = 2; string error = 3; }

// ─── Threads (Tendermint BFT) ─────────────────────────────────────────────────

message Thread {
  string   id           = 1;
  string   creator_did  = 2;
  repeated string replica_dids = 3; // ordered validator set, size N ≥ 3f+1
  int32    n            = 4; // replica count
  int32    f            = 5; // max byzantine faults tolerated
  int64    epoch_ms     = 6; // timeoutPropose in ms (default 1000)
  int64    created_at   = 7;
  map<string,string> metadata = 8;
}

message ThreadEntry {
  string author_did   = 1;
  bytes  payload      = 2; // serialized Message, TaskEvent, or arbitrary bytes
  string kind         = 3; // "message" | "task_event" | "custom"
  string author_sig   = 4; // Ed25519 sig over (thread_id || height || payload)
  int64  submitted_at = 5;
  // v2 encrypted-entry fields. payload carries ciphertext for v2 writes;
  // legacy v1 decoders retain the first five fields.
  uint32 encoding_version = 6;
  uint64 sequence = 7;
  bytes previous_block_hash = 8;
  uint64 membership_epoch = 9;
  uint64 encryption_epoch = 10;
  bytes nonce = 11;
  bytes author_signature = 12;
}

// An independently wrapped copy of an epoch data key. Envelope bytes are
// opaque to daemons and archive providers; recipients unwrap with X25519.
message ThreadKeyEnvelope {
  string thread_id = 1;
  uint64 encryption_epoch = 2;
  string recipient_did = 3;
  bytes ephemeral_public_key = 4;
  bytes nonce = 5;
  bytes ciphertext = 6;
  bool recovery_envelope = 7;
  // Deterministic signature by the thread creator over this envelope with
  // author_signature cleared. Required for recovery-envelope archival.
  bytes author_signature = 8;
}
message ThreadKeyEnvelopeQuery { string thread_id = 1; uint64 encryption_epoch = 2; }
message ThreadKeyEnvelopes { repeated ThreadKeyEnvelope envelopes = 1; }

message ThreadBlock {
  string   thread_id    = 1;
  int64    height       = 2; // monotonic block number
  int32    round        = 3; // round within height
  string   parent_hash  = 4; // block_hash of height-1 committed block ("" for genesis)
  repeated ThreadEntry entries = 5;
  string   proposer_did = 6;
  string   proposer_sig = 7; // sig over canonical(thread_id||height||round||parent_hash||entries_hash)
  string   block_hash   = 8; // sha256 of above fields 1-7
  int64    committed_at = 9; // set only on committed blocks
}

enum VoteType {
  VOTE_TYPE_UNSPECIFIED = 0;
  VOTE_TYPE_PREVOTE     = 1;
  VOTE_TYPE_PRECOMMIT   = 2;
}

message Vote {
  string   thread_id  = 1;
  int64    height     = 2;
  int32    round      = 3;
  VoteType type       = 4;
  string   block_hash = 5; // "" means nil vote
  string   voter_did  = 6;
  string   signature  = 7; // Ed25519 sig over (thread_id||height||round||type||block_hash)
}

message Proposal {
  string      thread_id    = 1;
  int64       height       = 2;
  int32       round        = 3;
  int32       pol_round    = 4; // proof-of-lock round (-1 if none)
  ThreadBlock block        = 5;
  string      proposer_did = 6;
  string      signature    = 7; // sig over (thread_id||height||round||block_hash)
}

// ─── Raft messages ────────────────────────────────────────────────────────────

message RaftRequestVote {
  int64  term           = 1;
  string candidate_did  = 2;
  int64  last_log_index = 3;
  int64  last_log_term  = 4;
  string signature      = 5;
}

message RaftRequestVoteReply {
  int64  term         = 1;
  bool   vote_granted = 2;
  string voter_did    = 3;
  string signature    = 4;
}

message RaftAppendEntries {
  int64  term           = 1;
  string leader_did     = 2;
  int64  prev_log_index = 3;
  int64  prev_log_term  = 4;
  repeated ThreadEntry entries = 5; // empty = heartbeat
  int64  leader_commit  = 6;
  string signature      = 7;
}

message RaftAppendEntriesReply {
  int64  term      = 1;
  bool   success   = 2;
  string peer_did  = 3;
  int64  match_index = 4; // highest index known to be replicated on peer
  string signature = 5;
}

// ConsensusMsg wraps any consensus message for GossipSub/stream transport.
message ConsensusMsg {
  string thread_id = 1;
  oneof payload {
    Proposal              proposal              = 2;
    Vote                  vote                  = 3;
    RaftRequestVote       raft_request_vote     = 4;
    RaftRequestVoteReply  raft_vote_reply       = 5;
    RaftAppendEntries     raft_append_entries   = 6;
    RaftAppendEntriesReply raft_append_reply    = 7;
    ThreadBlock           committed_block       = 8;
  }
}

// ─── Thread gRPC requests ──────────────────────────────────────────────────────

message CreateThreadRequest {
  repeated string replica_dids = 1; // desired validators (creator added automatically)
  int32  f         = 2; // desired fault tolerance (N = 3f+1)
  int64  epoch_ms  = 3; // timeoutPropose; 0 = default (1000ms)
  map<string,string> metadata = 4;
  // SDK-owned descriptor intent. These fields are required for authenticated
  // agent sessions; legacy daemon-owned creation leaves them empty.
  string thread_id = 5;
  string creator_did = 6;
  bytes creator_signature = 7;
  int64 created_at = 8;
  // Only accepted by CreateThreadWithRecovery. The descriptor must commit to
  // SHA-256(recovery_secret), allowing a fresh daemon to validate a handle
  // before it imports any history.
  bytes recovery_secret = 9;
}

message AppendEntryRequest {
  string thread_id = 1;
  bytes  payload   = 2;
  string kind      = 3;
  // SDK-prepared v2 ciphertext entry. When present, payload/kind are ignored.
  ThreadEntry encrypted_entry = 4;
}

message AppendEntryResult {
  string thread_id = 1;
  int64  height    = 2; // height the entry will appear in (once committed)
  string entry_id  = 3; // opaque ID for tracking
}

message GetThreadEntriesRequest {
  string thread_id  = 1;
  int64  since_height = 2; // 0 = from genesis
  int32  limit      = 3;
}

message ThreadEntryWithPos {
  int64       height = 1;
  int32       index  = 2; // index within block
  ThreadEntry entry  = 3;
  string      block_hash = 4;
}

message SubscribeThreadRequest {
  string thread_id    = 1;
  int64  since_height = 2;
}

message ThreadID {
  string id = 1;
}

// A complete handle is a read-only bearer capability and must never be logged,
// published through discovery, or treated as thread membership.
message ThreadRecoveryHandle {
  string thread_id = 1;
  bytes recovery_secret = 2;
  uint32 version = 3;
}

message CreateThreadResponse {
  Thread thread = 1;
  ThreadRecoveryHandle recovery_handle = 2;
}

enum ThreadAccess {
  THREAD_ACCESS_UNSPECIFIED = 0;
  THREAD_ACCESS_READ_ONLY = 1;
  THREAD_ACCESS_MEMBER = 2;
}

message RecoverThreadRequest {
  ThreadRecoveryHandle handle = 1;
  bool subscribe = 2;
}

message RecoverThreadResponse {
  Thread thread = 1;
  ThreadAccess access = 2;
}

message ThreadReplicaRequest {
  string thread_id = 1;
  string replica_did = 2;
}

enum ThreadMemberRole {
  THREAD_MEMBER_ROLE_UNSPECIFIED = 0;
  THREAD_MEMBER_ROLE_OBSERVER = 1;
  THREAD_MEMBER_ROLE_VOTER = 2;
  THREAD_MEMBER_ROLE_ADMIN = 3;
}

message ThreadMember { string did = 1; ThreadMemberRole role = 2; uint64 joined_epoch = 3; }
message ThreadMembers { repeated ThreadMember members = 1; }
message InviteThreadMemberRequest { string thread_id = 1; string invitee_did = 2; ThreadMemberRole role = 3; int64 expires_at_unix_ms = 4; bytes nonce = 5; bytes signature = 6; }
message ThreadInvitation { string thread_id = 1; string inviter_did = 2; string invitee_did = 3; ThreadMemberRole role = 4; int64 expires_at_unix_ms = 5; bytes nonce = 6; bytes signature = 7; }
message AcceptThreadInviteRequest { string thread_id = 1; bytes invite = 2; }
message PromoteThreadMemberRequest { string thread_id = 1; string member_did = 2; bytes catchup_proof = 3; }
message RemoveThreadMemberRequest { string thread_id = 1; string member_did = 2; }
message ThreadMembershipChange { string thread_id = 1; uint64 membership_epoch = 2; ThreadMember member = 3; bytes signed_invitation = 4; }
message ThreadCatchupState { string thread_id = 1; string observer_did = 2; int64 committed_height = 3; string head_block_hash = 4; }
message ThreadCatchupProof { string thread_id = 1; string observer_did = 2; int64 committed_height = 3; string head_block_hash = 4; int64 issued_at_unix_ms = 5; bytes signature = 6; }

message ArchiveProviderRecord {
  string provider_did = 1;
  string node_peer_id = 2;
  repeated string multiaddrs = 3;
  int64 expires_at_unix_ms = 4;
  bytes signature = 5;
}
message ArchiveAcknowledgement {
  string thread_id = 1;
  string provider_did = 2;
  string block_hash = 3;
  int64 acknowledged_at_unix_ms = 4;
  bytes signature = 5;
}

// ─── Files ────────────────────────────────────────────────────────────────────

message SendFileRequest {
  bytes  data      = 1; // raw file bytes
  string name      = 2; // original filename
  string mime_type = 3;
}

message FetchFileRequest {
  string cid      = 1; // CIDv1 (bafy...) to fetch via Bitswap
  string from_did = 2; // hint: DID of peer that has the block (optional, for faster connect)
}

message FileChunk {
  bytes  data   = 1;
  int64  offset = 2;
  int64  total  = 3; // total file size in bytes
}

// ─── PubSub ───────────────────────────────────────────────────────────────────

message PublishRequest {
  string topic   = 1;
  bytes  payload = 2;
}

message PublishResponse {
  string topic = 1;
}

message SubscribeTopicRequest {
  string topic = 1;
}

message TopicMessage {
  string topic      = 1;
  bytes  payload    = 2;
  int64  emitted_at = 3;
}

// ─── Webhooks ─────────────────────────────────────────────────────────────────

message SetWebhookRequest {
  string url    = 1;
  string secret = 2;
}

message WebhookResponse {
  string url = 1;
}

// ─── Networks ─────────────────────────────────────────────────────────────────

message NetworkInfo {
  string id          = 1;
  string name        = 2;
  string creator_did = 3;
  int64  created_at  = 4;
}

message NetworkMember {
  string did       = 1;
  int64  joined_at = 2;
}

message CreateNetworkRequest {
  string name = 1;
}

message NetworkIDRequest {
  string network_id = 1;
}

message JoinNetworkRequest {
  string network_id = 1;
}

message BroadcastRequest {
  string network_id = 1;
  bytes  payload    = 2;
}

message ListNetworksResponse {
  repeated NetworkInfo networks = 1;
}

message NetworkMembersResponse {
  repeated NetworkMember members = 1;
}

message BroadcastMessage {
  string network_id = 1;
  bytes  payload    = 2;
  int64  emitted_at = 3;
}

// ─── Names ────────────────────────────────────────────────────────────────────

message ClaimNameRequest {
  string name = 1;
}

message ResolveNameRequest {
  string name = 1;
}

message NameClaimResponse {
  string name         = 1;
  string did          = 2;
  int64  expires_at   = 3;
  int64  published_at = 4;
}

// ─── Peer Connections ─────────────────────────────────────────────────────────

message ConnectPeerRequest {
  string did = 1; // DID of the agent to connect to
}

message ConnectPeerResponse {
  string peer_id              = 1; // libp2p peer ID
  repeated string multiaddrs  = 2; // multiaddrs used
  bool   already_connected    = 3; // true if connection already existed
}
